<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caderno — Curadoria de Moda Brasileira</title>
<meta name="description" content="Centro de inteligência da curadoria de moda brasileira: pesquisa, marcas, tendências, planejamento editorial e conhecimento em um único lugar.">
<meta name="theme-color" content="#211C16">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/styles.css">
</head>
<body>

<button class="menu-toggle" id="menuToggle">☰</button>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="eyebrow">Fabiana Martins</span>
      <h1>Caderno</h1>
      <div class="sub">Curadoria de Moda Brasileira</div>
    </div>
    <nav class="nav" id="navList"></nav>
    <div class="sidebar-foot">Arquivo vivo — dados salvos neste navegador</div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="view-title" id="viewTitle">Dashboard</div>
      <div class="search-wrap">
        <span class="sic">⌕</span>
        <input type="text" id="globalSearch" placeholder="Buscar marca, tendência, tag, cidade...">
      </div>
      <button class="btn secondary small" id="exportBtn">Exportar dados</button>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBody"></div>
</div>

<div class="drawer-overlay" id="drawerOverlay">
  <div class="drawer" id="drawerBody"></div>
</div>

<div class="toast" id="toast"></div>

<!-- núcleo: dados, storage (localStorage), navegação, helpers relacionais -->
<script src="./js/core.js"></script>

<!-- módulos de cada área do caderno -->
<script src="./js/view-dashboard.js"></script>
<script src="./js/view-agenda.js"></script>
<script src="./js/view-editorial.js"></script>
<script src="./js/view-marcas.js"></script>
<script src="./js/view-tendencias.js"></script>
<script src="./js/view-colecoes.js"></script>
<script src="./js/view-concorrentes.js"></script>
<script src="./js/view-pesquisa.js"></script>
<script src="./js/view-biblioteca.js"></script>
<script src="./js/view-moodboards.js"></script>
<script src="./js/view-objetivos.js"></script>
<script src="./js/view-relatorios.js"></script>
<script src="./js/view-busca.js"></script>
<script src="./js/view-assistente.js"></script>

<!-- inicialização -->
<script src="./js/main.js"></script>

<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(()=>{ /* funciona normalmente mesmo se o SW falhar */ });
    });
  }
</script>
</body>
</html>
