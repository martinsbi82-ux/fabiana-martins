<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caderno — Curadoria de Moda Brasileira</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#211C16;
  --paper:#F5F0E6;
  --paper-2:#FCFAF3;
  --sand:#E6D9C1;
  --clay:#98502F;
  --clay-deep:#743A22;
  --clay-soft:#EAD9C9;
  --olive:#666238;
  --line:#D8CBAC;
  --line-soft:#E9E0CB;
  --danger:#9C4A3A;
  --font-display:'Fraunces', Georgia, serif;
  --font-body:'Inter', -apple-system, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:var(--paper);
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;}

/* ---------- layout shell ---------- */
.app{display:flex;min-height:100vh;}

.sidebar{
  width:236px;
  flex-shrink:0;
  background:var(--paper-2);
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
  position:fixed;
  top:0;left:0;bottom:0;
  z-index:40;
  transition:transform .25s ease;
}
.sidebar-brand{
  padding:28px 22px 18px;
  border-bottom:1px solid var(--line-soft);
  position:relative;
}
.sidebar-brand::before{
  content:'Nº 01';
  position:absolute;
  top:28px;right:22px;
  font-family:var(--font-display);
  font-style:italic;
  font-size:10.5px;
  color:var(--clay);
  opacity:.75;
}
.sidebar-brand .eyebrow{
  font-size:10.5px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--olive);
  font-weight:600;
}
.sidebar-brand h1{
  font-family:var(--font-display);
  font-weight:500;
  font-size:21px;
  margin-top:4px;
  line-height:1.2;
}
.sidebar-brand .sub{
  font-size:11px;
  color:#8a8370;
  margin-top:4px;
  font-style:italic;
  font-family:var(--font-display);
}
.nav{flex:1;overflow-y:auto;padding:14px 10px;}
.nav-group-label{
  font-size:10px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:#9a9280;
  padding:14px 12px 6px;
  font-weight:600;
}
.nav-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 12px;
  border-radius:6px;
  font-size:13.5px;
  color:#4a4638;
  cursor:pointer;
  transition:background .15s;
  position:relative;
}
.nav-item:hover{background:var(--sand);}
.nav-item.active{background:var(--ink);color:var(--paper-2);}
.nav-item .ic{width:16px;text-align:center;font-size:13px;opacity:.8;}
.sidebar-foot{
  padding:14px 22px 20px;
  border-top:1px solid var(--line-soft);
  font-size:10.5px;
  color:#a39c88;
  letter-spacing:.03em;
}

.menu-toggle{
  display:none;
  position:fixed;top:14px;left:14px;z-index:50;
  width:38px;height:38px;
  background:var(--ink);color:var(--paper);
  border:none;border-radius:8px;
  font-size:16px;
  align-items:center;justify-content:center;
}

.main{
  margin-left:236px;
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

.topbar{
  display:flex;
  align-items:center;
  gap:16px;
  padding:18px 32px;
  border-bottom:1px solid var(--line);
  background:var(--paper-2);
  position:sticky;top:0;z-index:20;
}
.topbar .view-title{
  font-family:var(--font-display);
  font-size:22px;
  font-weight:500;
  flex-shrink:0;
}
.search-wrap{
  flex:1;
  max-width:420px;
  position:relative;
}
.search-wrap input{
  width:100%;
  padding:9px 14px 9px 32px;
  border:1px solid var(--line);
  border-radius:20px;
  background:var(--paper);
  font-size:13px;
  color:var(--ink);
}
.search-wrap input:focus{outline:none;border-color:var(--clay);}
.search-wrap .sic{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:12px;color:#9a9280;}

.content{
  padding:28px 32px 60px;
  max-width:1180px;
  width:100%;
}

/* ---------- generic components ---------- */
.eyebrow-label{
  font-size:10.5px;
  letter-spacing:.13em;
  text-transform:uppercase;
  color:var(--olive);
  font-weight:600;
  margin-bottom:6px;
  display:block;
}
.section-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  margin-bottom:20px;
  flex-wrap:wrap;
  gap:12px;
}
.section-head h2{
  font-family:var(--font-display);
  font-size:26px;
  font-weight:500;
}
.section-sub{color:#847d6c;font-size:13px;margin-top:3px;}

.btn{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:9px 16px;
  border-radius:20px;
  border:1px solid var(--ink);
  background:var(--ink);
  color:var(--paper-2);
  font-size:12.5px;
  font-weight:500;
  letter-spacing:.02em;
  transition:opacity .15s;
}
.btn:hover{opacity:.82;}
.btn.secondary{background:transparent;color:var(--ink);border-color:var(--line);}
.btn.secondary:hover{background:var(--sand);opacity:1;}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger);}
.btn.small{padding:5px 12px;font-size:11.5px;}

.grid{display:grid;gap:16px;}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:900px){.grid.cols-4{grid-template-columns:repeat(2,1fr);}.grid.cols-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.grid.cols-4,.grid.cols-3,.grid.cols-2{grid-template-columns:1fr;}}

.card{
  background:var(--paper-2);
  border:1px solid var(--line);
  border-radius:10px;
  padding:18px;
}
.stat-card .num{
  font-family:var(--font-display);
  font-size:32px;
  font-weight:500;
  line-height:1;
}
.stat-card .lbl{
  font-size:11.5px;
  color:#847d6c;
  margin-top:6px;
  text-transform:uppercase;
  letter-spacing:.06em;
}

.record-card{
  background:var(--paper-2);
  border:1px solid var(--line);
  border-radius:10px;
  padding:16px 18px;
  cursor:pointer;
  transition:border-color .15s, transform .15s;
  position:relative;
}
.record-card:hover{border-color:var(--clay);}
.record-card .archive-no{
  display:inline-block;
  font-family:var(--font-display);
  font-style:italic;
  font-size:10.5px;
  color:var(--clay-deep);
  letter-spacing:.03em;
  background:var(--clay-soft);
  padding:2px 8px;
  border-radius:3px;
}
.record-card h3{
  font-family:var(--font-display);
  font-size:17px;
  font-weight:500;
  margin:4px 0 6px;
}
.record-card .meta{font-size:12px;color:#847d6c;line-height:1.5;}
.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.tag{
  font-size:10.5px;
  padding:3px 9px;
  border-radius:12px;
  background:var(--sand);
  color:#4a4638;
  letter-spacing:.02em;
}
.tag.status-Pesquisando{background:#EFE6D2;color:#7d6b3d;}
.tag.status-Acompanhando{background:#DDE3D0;color:#5c6b3f;}
.tag.status-Aprovada{background:#D9E6DD;color:#3d6b52;}
.tag.status-Em.avaliação{background:#EAD9CE;color:var(--clay-deep);}
.tag.status-Descartada{background:#E9D6D2;color:var(--danger);}

.empty-state{
  text-align:center;
  padding:60px 20px;
  color:#9a9280;
  border:1px dashed var(--line);
  border-radius:10px;
  font-size:13.5px;
}
.empty-state .ic{font-size:26px;margin-bottom:10px;display:block;}

/* ---------- modal ---------- */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(34,31,26,.45);
  display:none;
  align-items:flex-start;
  justify-content:center;
  z-index:100;
  padding:40px 16px;
  overflow-y:auto;
}
.modal-overlay.open{display:flex;}
.modal{
  background:var(--paper-2);
  border-radius:14px;
  width:100%;
  max-width:640px;
  padding:26px 28px 28px;
  box-shadow:0 20px 60px rgba(0,0,0,.2);
}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.modal-head h3{font-family:var(--font-display);font-size:20px;font-weight:500;}
.modal-close{background:none;border:none;font-size:18px;color:#9a9280;}
.field{margin-bottom:14px;}
.field label{
  display:block;
  font-size:11px;
  letter-spacing:.05em;
  text-transform:uppercase;
  color:#847d6c;
  margin-bottom:5px;
  font-weight:600;
}
.field input,.field textarea,.field select{
  width:100%;
  padding:9px 11px;
  border:1px solid var(--line);
  border-radius:7px;
  background:var(--paper);
  font-size:13.5px;
  color:var(--ink);
}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--clay);}
.field textarea{min-height:70px;resize:vertical;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:520px){.field-row{grid-template-columns:1fr;}}
.modal-actions{display:flex;justify-content:space-between;margin-top:20px;padding-top:16px;border-top:1px solid var(--line-soft);}

/* ---------- detail drawer ---------- */
.drawer-overlay{
  position:fixed;inset:0;
  background:rgba(34,31,26,.4);
  display:none;
  z-index:90;
  justify-content:flex-end;
}
.drawer-overlay.open{display:flex;}
.drawer{
  background:var(--paper-2);
  width:100%;
  max-width:560px;
  height:100%;
  overflow-y:auto;
  padding:30px 30px 60px;
}
.drawer .archive-no{font-family:var(--font-display);font-style:italic;color:var(--clay);font-size:12px;}
.drawer h2{font-family:var(--font-display);font-size:26px;font-weight:500;margin:6px 0 4px;}
.drawer-close{position:absolute;top:20px;right:20px;background:none;border:none;font-size:20px;color:#9a9280;}
.dblock{margin-top:20px;padding-top:16px;border-top:1px solid var(--line-soft);}
.dblock .dlabel{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#847d6c;font-weight:600;margin-bottom:6px;}
.dblock .dval{font-size:13.5px;line-height:1.6;color:#3a352b;white-space:pre-wrap;}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

/* ---------- table (concorrentes) ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;}
table{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--paper-2);}
th{
  text-align:left;padding:11px 14px;
  background:var(--sand);
  font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:#5c563f;
  white-space:nowrap;
}
td{padding:11px 14px;border-top:1px solid var(--line-soft);white-space:nowrap;}

/* ---------- kanban (editorial) ---------- */
.kanban{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;overflow-x:auto;}
@media(max-width:1000px){.kanban{grid-template-columns:repeat(5,220px);}}
.kanban-col{min-width:200px;}
.kanban-col-head{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#847d6c;font-weight:600;margin-bottom:10px;padding-left:2px;}
.kanban-card{background:var(--paper-2);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;cursor:pointer;}
.kanban-card:hover{border-color:var(--clay);}
.kanban-card .plat{font-size:10px;color:var(--clay);text-transform:uppercase;letter-spacing:.05em;font-weight:600;}
.kanban-card .tit{font-size:13px;margin-top:4px;line-height:1.4;}
.kanban-card .dt{font-size:10.5px;color:#9a9280;margin-top:6px;}

/* ---------- week agenda ---------- */
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;}
@media(max-width:900px){.week-grid{grid-template-columns:1fr;}}
.day-col{background:var(--paper-2);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:120px;}
.day-col .day-head{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#847d6c;font-weight:600;margin-bottom:8px;}
.routine-suggestion{
  background:var(--clay-soft);
  border:1px dashed var(--clay);
  border-radius:6px;
  padding:7px 9px;
  margin-bottom:10px;
  font-size:11.5px;
  color:var(--clay-deep);
  cursor:pointer;
  transition:opacity .15s;
}
.routine-suggestion:hover{opacity:.8;}
.routine-suggestion .rlabel{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;opacity:.8;margin-bottom:2px;}
.routine-suggestion .radd{float:right;font-weight:600;}
.task-chip{
  background:var(--paper);border:1px solid var(--line-soft);border-radius:6px;
  padding:7px 9px;margin-bottom:7px;font-size:11.5px;cursor:pointer;
  border-left:3px solid var(--clay);
}
.task-chip.prio-Alta{border-left-color:var(--danger);}
.task-chip.prio-Média{border-left-color:var(--clay);}
.task-chip.prio-Baixa{border-left-color:var(--olive);}
.task-chip .cat{font-size:9.5px;text-transform:uppercase;color:#9a9280;letter-spacing:.04em;}

/* ---------- goals ---------- */
.goal-bar-bg{background:var(--sand);border-radius:10px;height:8px;overflow:hidden;margin-top:8px;}
.goal-bar-fill{background:var(--clay);height:100%;border-radius:10px;transition:width .3s;}

/* ---------- reports bars ---------- */
.report-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.report-bar-label{width:150px;font-size:12px;flex-shrink:0;color:#4a4638;}
.report-bar-track{flex:1;background:var(--sand);border-radius:6px;height:16px;overflow:hidden;}
.report-bar-fill{background:var(--olive);height:100%;}
.report-bar-val{width:28px;text-align:right;font-size:12px;color:#847d6c;flex-shrink:0;}

/* ---------- assistant ---------- */
.chat-box{background:var(--paper-2);border:1px solid var(--line);border-radius:12px;padding:18px;min-height:260px;max-height:440px;overflow-y:auto;margin-bottom:14px;}
.chat-msg{margin-bottom:16px;}
.chat-msg .who{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--olive);font-weight:600;margin-bottom:4px;}
.chat-msg.user .who{color:var(--clay);}
.chat-msg .txt{font-size:13.5px;line-height:1.6;white-space:pre-wrap;}
.chat-input-row{display:flex;gap:10px;}
.chat-input-row textarea{flex:1;min-height:60px;}
.ai-quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.ai-quick button{
  font-size:11.5px;padding:6px 12px;border-radius:16px;
  background:var(--sand);border:1px solid var(--line);color:#4a4638;
}

.mood-thumb-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.mood-thumb{position:relative;width:64px;height:64px;border-radius:6px;overflow:hidden;border:1px solid var(--line);}
.mood-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.mood-thumb-del{
  position:absolute;top:2px;right:2px;
  width:18px;height:18px;border-radius:50%;border:none;
  background:rgba(33,28,22,.75);color:#fff;font-size:10px;line-height:1;
}
.rel-check-list{
  max-height:160px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;
  padding:8px 10px;background:var(--paper);
}
.rel-check{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:5px 2px;cursor:pointer;}
.rel-check input{margin:0;}
.rel-tag{cursor:pointer;background:var(--clay-soft);color:var(--clay-deep);}
.rel-tag:hover{opacity:.8;}
.rel-empty{font-size:12px;color:#9a9280;}
.moodboard-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;}
.mood-card{background:var(--paper-2);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;}
.mood-card .swatch{height:110px;background:linear-gradient(135deg,var(--sand),var(--line));display:flex;align-items:center;justify-content:center;color:#9a9280;font-size:11px;}
.mood-card .mc-body{padding:10px 12px;}
.mood-card .mc-cat{font-size:9.5px;text-transform:uppercase;color:var(--clay);letter-spacing:.05em;font-weight:600;}
.mood-card h4{font-family:var(--font-display);font-size:14px;margin-top:3px;}

.pill-select{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.pill-select button{
  padding:6px 14px;border-radius:16px;font-size:12px;
  border:1px solid var(--line);background:var(--paper);color:#4a4638;
}
.pill-select button.active{background:var(--ink);color:var(--paper-2);border-color:var(--ink);}

.scroll-x{overflow-x:auto;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}

.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--paper-2);
  padding:10px 20px;border-radius:20px;font-size:12.5px;
  z-index:200;opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

@media(max-width:860px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;}
  .menu-toggle{display:flex;}
  .topbar{padding:16px 18px 16px 60px;}
  .content{padding:20px 18px 60px;}
}
</style>
</head>
<body>

<button class="menu-toggle" id="menuToggle">☰</button>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="eyebrow">Fabiana Martins</span>
      <h1>Caderno</h1>
      <div class="sub">Curadoria de Moda Brasileira</div>
    </div>
    <nav class="nav" id="navList"></nav>
    <div class="sidebar-foot">Arquivo vivo — atualizado localmente</div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="view-title" id="viewTitle">Dashboard</div>
      <div class="search-wrap">
        <span class="sic">⌕</span>
        <input type="text" id="globalSearch" placeholder="Buscar marca, tendência, tag, cidade...">
      </div>
      <button class="btn secondary small" id="exportBtn">Exportar dados</button>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBody"></div>
</div>

<div class="drawer-overlay" id="drawerOverlay">
  <div class="drawer" id="drawerBody"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CADERNO — CRM de Curadoria de Moda Brasileira
   Vanilla JS, persistência via window.storage (por usuário)
   ============================================================ */

const KEYS = {
  tasks:'crm:tasks', editorial:'crm:editorial', brands:'crm:brands',
  trends:'crm:trends', library:'crm:library', moodboards:'crm:moodboards',
  collections:'crm:collections', market:'crm:market', goals:'crm:goals'
};

let DB = { tasks:[], editorial:[], brands:[], trends:[], library:[], moodboards:[], collections:[], market:[], goals:[] };
let currentView = 'dashboard';
let searchTerm = '';

/* ---------------- storage helpers ---------------- */
async function loadAll(){
  for(const k of Object.keys(KEYS)){
    try{
      const r = await window.storage.get(KEYS[k], false);
      DB[k] = r && r.value ? JSON.parse(r.value) : [];
    }catch(e){ DB[k] = []; }
  }
}
async function save(key){
  try{ await window.storage.set(KEYS[key], JSON.stringify(DB[key]), false); }
  catch(e){ console.error('storage error', e); }
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function archiveNo(list, idx){ return String(idx+1).padStart(3,'0'); }
function fmtDate(d){
  if(!d) return '—';
  try{ const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'}); }
  catch(e){ return d; }
}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}
function esc(s){ return (s||'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------------- relational helpers (marca ↔ tendência ↔ conteúdo ↔ coleção ↔ biblioteca) ---------------- */
function relLabel(item){ return item.nome || item.titulo || item.tema || item.marca || '(sem nome)'; }
function multiCheckList(name, items, selectedIds){
  selectedIds = selectedIds || [];
  if(!items.length) return `<div class="meta" style="padding:6px 0;">Nada cadastrado ainda.</div>`;
  return `<div class="rel-check-list">${items.map(it=>`
    <label class="rel-check"><input type="checkbox" name="${name}" value="${it.id}" ${selectedIds.includes(it.id)?'checked':''}> ${esc(relLabel(it))}</label>
  `).join('')}</div>`;
}
function singleSelect(name, items, selectedId){
  return `<select name="${name}"><option value="">— nenhum —</option>${items.map(it=>`<option value="${it.id}" ${selectedId===it.id?'selected':''}>${esc(relLabel(it))}</option>`).join('')}</select>`;
}
function relTag(item, view, extra){
  return `<span class="tag rel-tag" data-goto="${view}" data-goto-id="${item.id}">${esc(relLabel(item))}${extra?' · '+esc(extra):''}</span>`;
}
function attachGotoLinks(root){
  (root||document).querySelectorAll('[data-goto]').forEach(el=>{
    el.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      const view = el.dataset.goto, id = el.dataset.gotoId;
      if(view==='marcas') openBrandDetail(id);
      if(view==='tendencias') openTrendDetail(id);
      if(view==='colecoes') openColDetail(id);
      if(view==='biblioteca'){ const l=DB.library.find(x=>x.id===id); if(l) openLibModal(l); }
      if(view==='editorial'){ setView('editorial'); }
    });
  });
}
/* backlinks: which records elsewhere point to this brand/trend/collection id */
function trendsForBrand(brandId){ return DB.trends.filter(t=>(t.relatedBrands||[]).includes(brandId)); }
function collectionsForBrand(brandId){ return DB.collections.filter(c=>(c.relatedBrands||[]).includes(brandId)); }
function contentForBrand(brandId){ return DB.editorial.filter(e=>e.relatedBrand===brandId); }
function libraryForBrand(brandId){ return DB.library.filter(l=>(l.relatedBrands||[]).includes(brandId)); }
function brandsForTrend(trendId){ return DB.brands.filter(b=>trendsForBrand(b.id).some(t=>t.id===trendId)); }
function contentForTrend(trendId){ return DB.editorial.filter(e=>e.relatedTrend===trendId); }
function libraryForTrend(trendId){ return DB.library.filter(l=>(l.relatedTrends||[]).includes(trendId)); }
function contentForCollection(colId){ return DB.editorial.filter(e=>e.relatedCollection===colId); }
function brandsForCollection(colId){ const c=DB.collections.find(x=>x.id===colId); return c ? DB.brands.filter(b=>(c.relatedBrands||[]).includes(b.id)) : []; }

/* ---------------- nav config ---------------- */
const NAV = [
  {group:'Visão geral', items:[
    {id:'dashboard', label:'Dashboard', ic:'◆'},
    {id:'assistente', label:'Assistente', ic:'✦'},
  ]},
  {group:'Planejamento', items:[
    {id:'agenda', label:'Agenda', ic:'▤'},
    {id:'editorial', label:'Planejamento Editorial', ic:'▥'},
    {id:'objetivos', label:'Objetivos', ic:'◎'},
  ]},
  {group:'Curadoria', items:[
    {id:'marcas', label:'Banco de Marcas', ic:'▣'},
    {id:'tendencias', label:'Tendências', ic:'✺'},
    {id:'colecoes', label:'Coleções', ic:'▦'},
    {id:'concorrentes', label:'Concorrentes', ic:'⇄'},
    {id:'pesquisa', label:'Pesquisa de Mercado', ic:'⚲'},
  ]},
  {group:'Conhecimento', items:[
    {id:'biblioteca', label:'Biblioteca', ic:'▧'},
    {id:'moodboards', label:'Moodboards', ic:'▨'},
    {id:'relatorios', label:'Relatórios', ic:'▩'},
  ]},
];

function renderNav(){
  const nav = document.getElementById('navList');
  nav.innerHTML = NAV.map(g=>`
    <div class="nav-group-label">${g.group}</div>
    ${g.items.map(it=>`<div class="nav-item ${currentView===it.id?'active':''}" data-view="${it.id}">
      <span class="ic">${it.ic}</span><span>${it.label}</span>
    </div>`).join('')}
  `).join('');
  nav.querySelectorAll('.nav-item').forEach(el=>{
    el.addEventListener('click', ()=>{ setView(el.dataset.view); });
  });
}

function setView(v){
  currentView = v;
  searchTerm='';
  document.getElementById('globalSearch').value='';
  renderNav();
  const titles = {};
  NAV.forEach(g=>g.items.forEach(it=>titles[it.id]=it.label));
  document.getElementById('viewTitle').textContent = titles[v] || v;
  document.getElementById('sidebar').classList.remove('open');
  render();
}

/* ---------------- modal / drawer helpers ---------------- */
function openModal(html){
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); }
function openDrawer(html){
  document.getElementById('drawerBody').innerHTML = html;
  document.getElementById('drawerOverlay').classList.add('open');
}
function closeDrawer(){ document.getElementById('drawerOverlay').classList.remove('open'); }

document.getElementById('modalOverlay').addEventListener('click', e=>{ if(e.target.id==='modalOverlay') closeModal(); });
document.getElementById('drawerOverlay').addEventListener('click', e=>{ if(e.target.id==='drawerOverlay') closeDrawer(); });
document.getElementById('menuToggle').addEventListener('click', ()=> document.getElementById('sidebar').classList.toggle('open'));

document.getElementById('globalSearch').addEventListener('input', e=>{
  searchTerm = e.target.value.trim().toLowerCase();
  if(searchTerm && currentView!=='busca'){ currentView='busca'; renderNav(); document.getElementById('viewTitle').textContent='Busca'; }
  if(!searchTerm && currentView==='busca'){ setView('dashboard'); return; }
  render();
});

document.getElementById('exportBtn').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'caderno-curadoria-export.json';
  a.click();
  toast('Dados exportados');
});

/* ---------------- master render ---------------- */
function render(){
  const c = document.getElementById('content');
  if(searchTerm){ c.innerHTML = viewBusca(); attachBuscaEvents(); return; }
  switch(currentView){
    case 'dashboard': c.innerHTML = viewDashboard(); attachDashboardEvents(); break;
    case 'assistente': c.innerHTML = viewAssistente(); attachAssistenteEvents(); break;
    case 'agenda': c.innerHTML = viewAgenda(); attachAgendaEvents(); break;
    case 'editorial': c.innerHTML = viewEditorial(); attachEditorialEvents(); break;
    case 'objetivos': c.innerHTML = viewObjetivos(); attachObjetivosEvents(); break;
    case 'marcas': c.innerHTML = viewMarcas(); attachMarcasEvents(); break;
    case 'tendencias': c.innerHTML = viewTendencias(); attachTendenciasEvents(); break;
    case 'colecoes': c.innerHTML = viewColecoes(); attachColecoesEvents(); break;
    case 'concorrentes': c.innerHTML = viewConcorrentes(); break;
    case 'pesquisa': c.innerHTML = viewPesquisa(); attachPesquisaEvents(); break;
    case 'biblioteca': c.innerHTML = viewBiblioteca(); attachBibliotecaEvents(); break;
    case 'moodboards': c.innerHTML = viewMoodboards(); attachMoodboardsEvents(); break;
    case 'relatorios': c.innerHTML = viewRelatorios(); break;
    default: c.innerHTML = '<div class="empty-state">Módulo em construção.</div>';
  }
}

/* ================================================================
   DASHBOARD
   ================================================================ */
function viewDashboard(){
  const today = new Date().toISOString().slice(0,10);
  const weekAhead = new Date(Date.now()+7*86400000).toISOString().slice(0,10);
  const upcomingTasks = DB.tasks.filter(t=>t.prazo>=today && t.prazo<=weekAhead && !t.concluida)
    .sort((a,b)=>a.prazo.localeCompare(b.prazo)).slice(0,5);
  const scheduledContent = DB.editorial.filter(e=>e.status==='Agendado').slice(0,5);
  const pendingBrands = DB.brands.filter(b=>b.status==='Pesquisando' || b.status==='Em avaliação').slice(0,5);
  const weekTrends = DB.trends.filter(t=>{
    if(!t.createdAt) return false;
    return (Date.now()-new Date(t.createdAt).getTime()) < 7*86400000;
  }).length;

  return `
  <div class="grid cols-4" style="margin-bottom:26px;">
    <div class="card stat-card"><div class="num">${DB.brands.length}</div><div class="lbl">Marcas cadastradas</div></div>
    <div class="card stat-card"><div class="num">${DB.trends.length}</div><div class="lbl">Tendências registradas</div></div>
    <div class="card stat-card"><div class="num">${DB.collections.length}</div><div class="lbl">Coleções acompanhadas</div></div>
    <div class="card stat-card"><div class="num">${weekTrends}</div><div class="lbl">Tendências esta semana</div></div>
  </div>

  <div class="grid cols-2">
    <div>
      <div class="section-head"><h2 style="font-size:18px;">Próximas tarefas</h2></div>
      ${upcomingTasks.length ? upcomingTasks.map(t=>`
        <div class="task-chip prio-${esc(t.prioridade)}" data-id="${t.id}">
          <div class="cat">${esc(t.categoria)} · ${fmtDate(t.prazo)}</div>
          <div>${esc(t.titulo)}</div>
        </div>`).join('') : `<div class="empty-state"><span class="ic">▤</span>Nenhuma tarefa nos próximos 7 dias.</div>`}

      <div class="section-head" style="margin-top:22px;"><h2 style="font-size:18px;">Marcas pendentes de análise</h2></div>
      ${pendingBrands.length ? pendingBrands.map((b,i)=>`
        <div class="task-chip" data-brand="${b.id}"><div class="cat">${esc(b.status)}</div><div>${esc(b.nome)}</div></div>
      `).join('') : `<div class="empty-state"><span class="ic">▣</span>Nenhuma marca pendente.</div>`}
    </div>

    <div>
      <div class="section-head"><h2 style="font-size:18px;">Conteúdos programados</h2></div>
      ${scheduledContent.length ? scheduledContent.map(e=>`
        <div class="task-chip" data-ed="${e.id}"><div class="cat">${esc(e.plataforma)} · ${fmtDate(e.data)}</div><div>${esc(e.tema)}</div></div>
      `).join('') : `<div class="empty-state"><span class="ic">▥</span>Nada agendado ainda.</div>`}

      <div class="section-head" style="margin-top:22px;"><h2 style="font-size:18px;">Prioridades</h2></div>
      ${DB.tasks.filter(t=>t.prioridade==='Alta' && !t.concluida).slice(0,5).map(t=>`
        <div class="task-chip prio-Alta" data-id="${t.id}"><div class="cat">${esc(t.categoria)}</div><div>${esc(t.titulo)}</div></div>
      `).join('') || `<div class="empty-state"><span class="ic">◎</span>Sem prioridades altas no momento.</div>`}
    </div>
  </div>
  `;
}
function attachDashboardEvents(){
  document.querySelectorAll('[data-brand]').forEach(el=>el.addEventListener('click',()=>openBrandDetail(el.dataset.brand)));
  document.querySelectorAll('[data-ed]').forEach(el=>el.addEventListener('click',()=>{ setView('editorial'); }));
  document.querySelectorAll('[data-id]').forEach(el=>{ if(el.dataset.id) el.addEventListener('click',()=>{ setView('agenda'); }); });
}

/* ================================================================
   AGENDA
   ================================================================ */
const CATS_AGENDA = ['Pesquisa','Curadoria','Conteúdo','Networking','Estudos','Reuniões','Eventos','Visitas','Organização'];
const PRIORIDADES = ['Alta','Média','Baixa'];
const ROTINA_SEMANAL = [
  {dia:'Segunda', foco:'Pesquisa de mercado', categoria:'Pesquisa'},
  {dia:'Terça', foco:'Análise de marcas', categoria:'Curadoria'},
  {dia:'Quarta', foco:'Atualização das fichas', categoria:'Curadoria'},
  {dia:'Quinta', foco:'Produção de conteúdo', categoria:'Conteúdo'},
  {dia:'Sexta', foco:'Planejamento da próxima semana', categoria:'Organização'},
  {dia:'Sábado', foco:'Pesquisa livre', categoria:'Pesquisa'},
  {dia:'Domingo', foco:'Revisão e organização', categoria:'Organização'},
];

function weekDates(){
  const now = new Date();
  const day = now.getDay(); // 0 sun
  const monday = new Date(now); monday.setDate(now.getDate() - ((day+6)%7));
  return Array.from({length:7},(_,i)=>{ const d=new Date(monday); d.setDate(monday.getDate()+i); return d.toISOString().slice(0,10); });
}
function viewAgenda(){
  const days = weekDates();
  const dayNames = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
  return `
  <div class="section-head">
    <div><h2>Agenda</h2><div class="section-sub">Calendário semanal de atividades da curadoria</div></div>
    <button class="btn" id="newTaskBtn">+ Nova atividade</button>
  </div>
  <div class="week-grid">
    ${days.map((d,i)=>{
      const items = DB.tasks.filter(t=>t.prazo===d).sort((a,b)=>(a.prioridade<b.prioridade?1:-1));
      const rotina = ROTINA_SEMANAL[i];
      return `<div class="day-col">
        <div class="day-head">${dayNames[i]}<br><span style="color:#c2b89f;">${fmtDate(d)}</span></div>
        <div class="routine-suggestion" data-suggest="${i}" data-date="${d}">
          <span class="rlabel">Rotina sugerida</span>${esc(rotina.foco)} <span class="radd">+</span>
        </div>
        ${items.map(t=>`<div class="task-chip prio-${esc(t.prioridade)}" data-id="${t.id}">
          <div class="cat">${esc(t.categoria)}</div>${esc(t.titulo)}
        </div>`).join('') || ''}
      </div>`;
    }).join('')}
  </div>
  <div class="section-head" style="margin-top:30px;"><h2 style="font-size:18px;">Rotina semanal</h2></div>
  <div class="grid cols-4" style="margin-bottom:8px;">
    ${ROTINA_SEMANAL.map(r=>`<div class="card" style="padding:12px 14px;">
      <div class="eyebrow-label" style="margin-bottom:2px;">${r.dia}</div>
      <div style="font-size:13px;">${esc(r.foco)}</div>
    </div>`).join('')}
  </div>

  <div class="section-head" style="margin-top:30px;"><h2 style="font-size:18px;">Todas as atividades</h2></div>
  ${DB.tasks.length ? DB.tasks.slice().sort((a,b)=>(a.prazo||'').localeCompare(b.prazo||'')).map(t=>`
    <div class="record-card" style="margin-bottom:10px;" data-id="${t.id}">
      <div class="archive-no">${esc(t.categoria)} · ${esc(t.prioridade)}</div>
      <h3 style="font-size:15px;">${esc(t.titulo)}</h3>
      <div class="meta">${fmtDate(t.prazo)}${t.duracao?' · '+esc(t.duracao):''}${t.concluida?' · ✓ concluída':''}</div>
    </div>`).join('') : `<div class="empty-state"><span class="ic">▤</span>Nenhuma atividade cadastrada ainda.</div>`}
  `;
}
function taskForm(task, prefill){
  const t = task || Object.assign({titulo:'',categoria:'Pesquisa',prioridade:'Média',prazo:new Date().toISOString().slice(0,10),duracao:'',observacoes:'',checklist:'',concluida:false}, prefill||{});
  return `
  <div class="modal-head"><h3>${task?'Editar atividade':'Nova atividade'}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
  <form id="taskForm">
    <div class="field"><label>Título</label><input required name="titulo" value="${esc(t.titulo)}"></div>
    <div class="field-row">
      <div class="field"><label>Categoria</label><select name="categoria">${CATS_AGENDA.map(c=>`<option ${t.categoria===c?'selected':''}>${c}</option>`).join('')}</select></div>
      <div class="field"><label>Prioridade</label><select name="prioridade">${PRIORIDADES.map(c=>`<option ${t.prioridade===c?'selected':''}>${c}</option>`).join('')}</select></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Prazo</label><input type="date" name="prazo" value="${t.prazo}"></div>
      <div class="field"><label>Duração estimada</label><input name="duracao" placeholder="ex: 2h" value="${esc(t.duracao)}"></div>
    </div>
    <div class="field"><label>Checklist (uma linha por item)</label><textarea name="checklist">${esc(t.checklist)}</textarea></div>
    <div class="field"><label>Observações</label><textarea name="observacoes">${esc(t.observacoes)}</textarea></div>
    <div class="modal-actions">
      <div>${task?`<button type="button" class="btn danger small" id="delTaskBtn">Excluir</button>`:''}</div>
      <div style="display:flex;gap:8px;">
        ${task?`<button type="button" class="btn secondary small" id="toggleDoneBtn">${t.concluida?'Marcar pendente':'Marcar concluída'}</button>`:''}
        <button type="submit" class="btn small">Salvar</button>
      </div>
    </div>
  </form>`;
}
function attachAgendaEvents(){
  document.getElementById('newTaskBtn').addEventListener('click', ()=> openTaskModal());
  document.querySelectorAll('[data-id]').forEach(el=>el.addEventListener('click',()=>{
    const t = DB.tasks.find(x=>x.id===el.dataset.id); if(t) openTaskModal(t);
  }));
  document.querySelectorAll('[data-suggest]').forEach(el=>el.addEventListener('click',()=>{
    const rotina = ROTINA_SEMANAL[Number(el.dataset.suggest)];
    openTaskModal(null, {titulo:rotina.foco, categoria:rotina.categoria, prazo:el.dataset.date});
  }));
}
function openTaskModal(task, prefill){
  openModal(taskForm(task, prefill));
  document.getElementById('taskForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const f = new FormData(e.target);
    const obj = Object.fromEntries(f.entries());
    if(task){ Object.assign(task, obj); }
    else { DB.tasks.push({id:uid(), ...obj, concluida:false}); }
    await save('tasks'); closeModal(); render(); toast('Atividade salva');
  });
  if(task){
    document.getElementById('delTaskBtn').addEventListener('click', async ()=>{
      DB.tasks = DB.tasks.filter(x=>x.id!==task.id); await save('tasks'); closeModal(); render(); toast('Atividade excluída');
    });
    document.getElementById('toggleDoneBtn').addEventListener('click', async ()=>{
      task.concluida = !task.concluida; await save('tasks'); closeModal(); render(); toast('Status atualizado');
    });
  }
}

    </div>

function refreshMoodThumbs(){
  const row = document.getElementById('moodThumbRow');
  if(!row) return;
  row.innerHTML = moodThumbsHtml();
  row.querySelectorAll('.mood-thumb-del').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      currentMoodImages.splice(Number(btn.dataset.idx),1);
      refreshMoodThumbs();
    });
  });
}
function attachMoodboardsEvents(){
  document.getElementById('newMoodBtn').addEventListener('click', ()=>openMoodModal());
  document.querySelectorAll('.mood-card').forEach(el=>el.addEventListener('click',()=>{
    const m = DB.moodboards.find(x=>x.id===el.dataset.id); if(m) openMoodModal(m);
  }));
}
function openMoodModal(m0){
  openModal(moodForm(m0));
  refreshMoodThumbs();
  document.getElementById('moodFileInput').addEventListener('change', async e=>{
    const files = Array.from(e.target.files || []);
    for(const file of files){
      if(file.size > 1_500_000){ toast('Imagem muito grande, escolha uma menor'); continue; }
      const dataUrl = await new Promise((res,rej)=>{
        const r = new FileReader();
        r.onload = ()=>res(r.result);
        r.onerror = rej;
        r.readAsDataURL(file);
      });
      currentMoodImages.push(dataUrl);
    }
    refreshMoodThumbs();
    e.target.value = '';
  });
  document.getElementById('moodForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const obj = Object.fromEntries(new FormData(e.target).entries());
    obj.images = currentMoodImages.slice();
    if(m0){ Object.assign(m0, obj); } else { DB.moodboards.push({id:uid(), ...obj}); }
    try{
      await save('moodboards');
    }catch(err){
      toast('Não deu para salvar — as imagens podem estar pesadas demais');
      return;
    }
    closeModal(); render(); toast('Moodboard salvo');
  });
  if(m0){
    document.getElementById('delMoodBtn').addEventListener('click', async ()=>{
      DB.moodboards = DB.moodboards.filter(x=>x.id!==m0.id); await save('moodboards'); closeModal(); render(); toast('Moodboard excluído');
    });
  }
}

/* ================================================================

   ================================================================ */
function viewRelatorios(){
  const catCount = {};
  DB.brands.forEach(b=>{ const c=b.categoria||'Sem categoria'; catCount[c]=(catCount[c]||0)+1; });
  const statusCount = {};
  DB.brands.forEach(b=>{ statusCount[b.status]=(statusCount[b.status]||0)+1; });
  const pubCount = {};
  DB.editorial.forEach(e=>{ if(e.status==='Publicado'){ const p=e.plataforma||'Outros'; pubCount[p]=(pubCount[p]||0)+1; } });
  const maxCat = Math.max(1,...Object.values(catCount));
  const maxStatus = Math.max(1,...Object.values(statusCount));
  const maxPub = Math.max(1,...Object.values(pubCount));

  function bars(obj, max){
    return Object.entries(obj).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`
      <div class="report-bar-row">
        <div class="report-bar-label">${esc(k)}</div>
        <div class="report-bar-track"><div class="report-bar-fill" style="width:${(v/max)*100}%;"></div></div>
        <div class="report-bar-val">${v}</div>
      </div>`).join('') || '<div class="empty-state">Sem dados ainda.</div>';
  }
  return `
  <div class="section-head"><div><h2>Relatórios</h2><div class="section-sub">Visão consolidada da curadoria</div></div></div>
  <div class="grid cols-4" style="margin-bottom:26px;">
    <div class="card stat-card"><div class="num">${DB.brands.length}</div><div class="lbl">Marcas cadastradas</div></div>
    <div class="card stat-card"><div class="num">${DB.editorial.filter(e=>e.status==='Publicado').length}</div><div class="lbl">Conteúdos publicados</div></div>
    <div class="card stat-card"><div class="num">${DB.trends.length}</div><div class="lbl">Tendências registradas</div></div>
    <div class="card stat-card"><div class="num">${DB.tasks.filter(t=>t.concluida).length}/${DB.tasks.length}</div><div class="lbl">Tarefas concluídas</div></div>
  </div>
  <div class="grid cols-2">
    <div class="card"><h3 style="font-family:var(--font-display);font-size:16px;margin-bottom:14px;">Marcas mais pesquisadas por categoria</h3>${bars(catCount,maxCat)}</div>

  `;
}

/* ================================================================
   BUSCA INTELIGENTE
   ================================================================ */
function viewBusca(){
  const q = searchTerm;
  const matchB = DB.brands.filter(b=>JSON.stringify(b).toLowerCase().includes(q));
  const matchT = DB.trends.filter(t=>JSON.stringify(t).toLowerCase().includes(q));
  const matchC = DB.collections.filter(c=>JSON.stringify(c).toLowerCase().includes(q));
  const matchL = DB.library.filter(l=>JSON.stringify(l).toLowerCase().includes(q));
  const total = matchB.length+matchT.length+matchC.length+matchL.length;
  if(total===0) return `<div class="empty-state"><span class="ic">⌕</span>Nenhum resultado para "${esc(q)}".</div>`;
  function section(title, list, cls){
    if(!list.length) return '';
    return `<div class="section-head" style="margin-top:22px;"><h2 style="font-size:16px;">${title} (${list.length})</h2></div>
      <div class="grid cols-3">${list.map(x=>`<div class="record-card" data-${cls}="${x.id}">
        <h3>${esc(x.nome||x.titulo||x.marca)}</h3>
        <div class="meta">${esc(x.categoria||x.temporada||'')}</div>
      </div>`).join('')}</div>`;
  }
  return section('Marcas', matchB, 'brand') + section('Tendências', matchT, 'trend') + section('Coleções', matchC, 'col') + section('Biblioteca', matchL, 'lib');
}
function attachBuscaEvents(){
  document.querySelectorAll('[data-brand]').forEach(el=>el.addEventListener('click',()=>openBrandDetail(el.dataset.brand)));
  document.querySelectorAll('[data-trend]').forEach(el=>el.addEventListener('click',()=>openTrendDetail(el.dataset.trend)));
  document.querySelectorAll('[data-col]').forEach(el=>el.addEventListener('click',()=>openColDetail(el.dataset.col)));
  document.querySelectorAll('[data-lib]').forEach(el=>el.addEventListener('click',()=>{ const l=DB.library.find(x=>x.id===el.dataset.lib); if(l) openLibModal(l); }));
}

/* ================================================================
   ASSISTENTE (IA)
   ================================================================ */
let chatHistory = [];
const AI_QUICK_ACTIONS = [
  {label:'Resumir marcas em avaliação', fn:()=>{
    const list = DB.brands.filter(b=>b.status==='Em avaliação'||b.status==='Pesquisando');
    return `Resuma em tópicos objetivos o estado atual destas marcas em análise (nome, ponto forte, o que falta decidir): ${JSON.stringify(list.map(b=>({nome:b.nome,status:b.status,posicionamento:b.posicionamento,diferenciais:b.diferenciais,obs:b.observacoes})))}`;
  }},
  {label:'Sugerir prioridades da semana', fn:()=>{
    const pend = DB.tasks.filter(t=>!t.concluida);
    return `Com base nestas atividades pendentes da curadoria, sugira uma ordem de prioridade para a semana e uma justificativa curta para cada uma: ${JSON.stringify(pend.map(t=>({titulo:t.titulo,categoria:t.categoria,prioridade:t.prioridade,prazo:t.prazo})))}`;
  }},
  {label:'Gerar legenda de tendência', fn:()=>{
    const t = DB.trends[DB.trends.length-1];
    return t ? `Escreva uma legenda curta e editorial para Instagram (estilo "arquivo vivo", tom sofisticado, sem hashtags em excesso) sobre esta tendência: ${JSON.stringify(t)}` : 'Não há tendências cadastradas ainda — sugira como estruturar a primeira ficha de tendência.';
  }},
  {label:'Comparar marcas cadastradas', fn:()=>{
    return `Compare estas marcas cadastradas em termos de posicionamento, preço e diferenciais, apontando sobreposições e espaços em branco no portfólio: ${JSON.stringify(DB.brands.map(b=>({nome:b.nome,preco:b.preco,posicionamento:b.posicionamento,estilo:b.estilo,diferenciais:b.diferenciais})))}`;
  }},
  {label:'Sugerir calendário editorial', fn:()=>{
    return `Com base nestas tendências e marcas registradas, sugira 4 ideias de conteúdo editorial para a próxima semana (tema, formato, objetivo): tendências: ${JSON.stringify(DB.trends.slice(-5).map(t=>t.nome))}; marcas: ${JSON.stringify(DB.brands.slice(-5).map(b=>b.nome))}`;
  }},
  {label:'Identificar padrões no repertório', fn:()=>{
    const grafo = DB.trends.map(t=>({
      tendencia:t.nome,
      marcas:(t.relatedBrands||[]).map(id=>DB.brands.find(b=>b.id===id)).filter(Boolean).map(b=>b.nome),
      conteudos:contentForTrend(t.id).map(e=>e.tema)
    }));
    return `Este é o mapa de relações entre tendências, marcas e conteúdos já registrados na curadoria: ${JSON.stringify(grafo)}. Identifique padrões, marcas que aparecem em múltiplas tendências, lacunas de conteúdo ainda não produzido e oportunidades estratégicas para a curadoria.`;
  }},
];

function viewAssistente(){
  return `
  <div class="section-head"><div><h2>Assistente</h2><div class="section-sub">Resumos, comparações e sugestões geradas a partir dos seus dados</div></div></div>
  <div class="ai-quick" id="aiQuick">
    ${AI_QUICK_ACTIONS.map((a,i)=>`<button data-i="${i}">${a.label}</button>`).join('')}
  </div>
  <div class="chat-box" id="chatBox">
    ${chatHistory.length ? chatHistory.map(m=>`<div class="chat-msg ${m.role}"><div class="who">${m.role==='user'?'Você':'Assistente'}</div><div class="txt">${esc(m.text)}</div></div>`).join('')
      : `<div class="empty-state"><span class="ic">✦</span>Escolha uma ação rápida ou escreva uma pergunta sobre suas marcas, tendências ou conteúdo.</div>`}
  </div>
  <div class="chat-input-row">
    <textarea id="chatInput" placeholder="Pergunte algo sobre sua curadoria..."></textarea>
    <button class="btn" id="chatSendBtn" style="align-self:flex-end;">Enviar</button>
  </div>
  <div style="font-size:11px;color:#9a9280;margin-top:10px;">O assistente funciona dentro da pré-visualização do Claude. Se você publicar este arquivo no GitHub Pages, este painel deixa de responder — a menos que conecte sua própria chave de API.</div>
  `;
}
function attachAssistenteEvents(){
  document.getElementById('aiQuick').querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=> runAiPrompt(AI_QUICK_ACTIONS[btn.dataset.i].fn()));
  });
  document.getElementById('chatSendBtn').addEventListener('click', ()=>{
    const val = document.getElementById('chatInput').value.trim();
    if(val) runAiPrompt(val);
  });
}
async function runAiPrompt(promptText){
  chatHistory.push({role:'user', text:promptText.length>400 ? promptText.slice(0,400)+'…' : promptText});
  render();
  const box = document.getElementById('chatBox');
  box.innerHTML += `<div class="chat-msg"><div class="who">Assistente</div><div class="txt">Pensando…</div></div>`;
  box.scrollTop = box.scrollHeight;
  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{role:"user", content: `Você é um assistente de curadoria de moda brasileira, direto e editorial no tom. ${promptText}`}]
      })
    });
    const data = await response.json();
    const textParts = (data.content||[]).filter(c=>c.type==='text').map(c=>c.text);
    const answer = textParts.join('\n') || 'Não foi possível gerar uma resposta.';
    chatHistory.push({role:'assistant', text:answer});
  }catch(e){
    chatHistory.push({role:'assistant', text:'Não consegui me conectar ao assistente agora. Isso é esperado fora da pré-visualização do Claude.'});
  }
  render();
  document.getElementById('chatInput') && (document.getElementById('chatInput').value='');
}
